[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dbd1d"
version = "1.2.2"
description = "One-dimensional fluid model of dielectric barrier discharges generated from ZDPlasKin chemistry files"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.15,<1.19"]

[project.optional-dependencies]
figures = ["matplotlib>=3.5", "pillow>=9"]
test = ["pytest>=7", "matplotlib>=3.5", "pillow>=9"]

[tool.setuptools]
# the program runs from the folders of the repository (prototipo/, ferramentas/);
# installing the project only installs the dependencies
packages = []

[tool.pytest.ini_options]
testpaths = ["prototipo/testes"]
